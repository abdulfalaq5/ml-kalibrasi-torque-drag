# /etc/nginx/sites-available/td-ml  (nginx di HOST, di luar Docker)
# Ganti td.contoh.com dengan domain sebenarnya.

# Pembatas laju untuk endpoint login (konteks http)
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name td.contoh.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name td.contoh.com;

    ssl_certificate     /etc/letsencrypt/live/td.contoh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/td.contoh.com/privkey.pem;

    client_max_body_size 100m;          # file Excel .xlsm bisa beberapa MB

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Opsional (bila client setuju): batasi ke IP kantor
    # allow 203.0.113.0/24;
    # deny all;

    # Login: dibatasi 5 permintaan per menit per IP
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # HARI 1 SAJA (sampai login aplikasi lolos tes), lalu hapus dua baris ini:
        # auth_basic "Prototype";
        # auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;        # impor dan pelatihan bisa memakan waktu
        proxy_send_timeout 300s;
    }
}
