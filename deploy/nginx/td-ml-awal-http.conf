# Konfigurasi AWAL sebelum sertifikat ada (Hari 1). Pakai ini dulu, jalankan
#   sudo certbot --nginx -d dev-ml-kalibrasi-torque-rag.lokatali.my.id
# lalu ganti dengan td-ml.conf.
server {
    listen 80;
    server_name dev-ml-kalibrasi-torque-rag.lokatali.my.id;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8401;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
