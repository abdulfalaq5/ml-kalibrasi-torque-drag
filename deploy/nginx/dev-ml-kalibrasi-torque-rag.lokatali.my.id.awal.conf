# TAHAP 1 (sementara): hanya HTTP, untuk mengambil sertifikat Let's Encrypt.
# Pasang di: /etc/nginx/sites-available/dev-ml-kalibrasi-torque-rag.lokatali.my.id
# Setelah certbot berhasil, ganti isinya dengan file dev-ml-kalibrasi-torque-rag.lokatali.my.id.conf
#
# Aplikasi (Docker) harus sudah berjalan di mesin ini pada 127.0.0.1:8401.

server {
    listen 80;
    listen [::]:80;
    server_name dev-ml-kalibrasi-torque-rag.lokatali.my.id;

    # jalur verifikasi certbot (webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 503 "Sedang menyiapkan HTTPS\n";
    }
}
