# TAHAP 2 (final): HTTPS untuk dev-ml-kalibrasi-torque-rag.lokatali.my.id
# Pasang di: /etc/nginx/sites-available/dev-ml-kalibrasi-torque-rag.lokatali.my.id
#
#   Orang lain : https://dev-ml-kalibrasi-torque-rag.lokatali.my.id  -> nginx (443) -> 127.0.0.1:8401
#   Mesin ini  : http://localhost:8401                                 -> langsung ke aplikasi
#
# Aplikasi Docker hanya mendengarkan 127.0.0.1:8401 (docker-compose.yml), jadi port 8401 TIDAK
# terbuka ke internet; akses dari luar hanya lewat nginx + HTTPS.
# Login & cookie diatur aplikasi; .env server: COOKIE_SECURE=true.

# Batas laju endpoint login: 5 permintaan/menit per IP (konteks http; nama zona unik
# agar tidak bentrok dengan situs lain di server yang sama)
limit_req_zone $binary_remote_addr zone=tdml_login:10m rate=5r/m;

upstream tdml_app {
    server 127.0.0.1:8401;
    keepalive 16;
}

# HTTP -> HTTPS (jalur certbot tetap dilayani untuk perpanjangan sertifikat)
server {
    listen 80;
    listen [::]:80;
    server_name dev-ml-kalibrasi-torque-rag.lokatali.my.id;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;    # nginx < 1.25.1: hapus baris ini dan pakai "listen 443 ssl http2;"
    server_name dev-ml-kalibrasi-torque-rag.lokatali.my.id;

    ssl_certificate     /etc/letsencrypt/live/dev-ml-kalibrasi-torque-rag.lokatali.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-ml-kalibrasi-torque-rag.lokatali.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:tdml_ssl:10m;
    ssl_session_timeout 1d;

    # File Excel (.xlsm) bisa beberapa MB; sama dengan MAX_UPLOAD_MB di .env
    client_max_body_size 100m;

    # Header keamanan
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # Kompresi respons JSON/JS (dashboard memuat data grafik)
    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    # Opsional: batasi akses ke IP tertentu (kantor/VPN). Hapus tanda # bila diperlukan.
    # allow 203.0.113.0/24;
    # deny all;

    # Header proxy yang dipakai semua location
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Login: dibatasi 5 permintaan per menit per IP (aplikasi juga mengunci 15 menit setelah 5 gagal)
    location = /api/auth/login {
        limit_req zone=tdml_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://tdml_app;
    }

    # Unggah file & ekspor: waktu tunggu lebih panjang
    location ~ ^/api/(files|wells/[0-9]+/(export\.xlsx|report\.pdf)|models/[0-9]+/report\.(xlsx|pdf)|quality/report\.xlsx) {
        proxy_pass http://tdml_app;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_request_buffering off;
    }

    # Aset web hasil build (nama berhash) boleh di-cache browser lama
    location /assets/ {
        proxy_pass http://tdml_app;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://tdml_app;
        proxy_read_timeout 120s;
    }

    access_log /var/log/nginx/tdml.access.log;
    error_log  /var/log/nginx/tdml.error.log warn;
}
