services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /data/uploads
      MODEL_DIR: /data/models
      INBOX_DIR: /data/inbox
      PROCESSED_DIR: /data/processed
      REJECTED_DIR: /data/rejected
      MPLCONFIGDIR: /tmp/matplotlib
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
      - models:/data/models
      # Impor massal dari folder (bind mount; hanya ada di server/laptop, tidak di Git)
      - ./data/inbox:/data/inbox
      - ./data/processed:/data/processed
      - ./data/rejected:/data/rejected
    ports:
      - "127.0.0.1:8000:8000"   # hanya bisa diakses dari server itu sendiri (nginx)
    networks: [internal]

  # Backup database harian (cek ulang tag image di Docker Hub saat dipasang)
  backup:
    image: prodrigestivill/postgres-backup-local:16
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

volumes:
  pgdata:
  uploads:
  models:

networks:
  internal:
